<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions attempting to assign window.fetch
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return realFetch;
            },
            set: function(fn) {
              realFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress external browser extension runtime errors from bubbling up
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
